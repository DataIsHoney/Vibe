<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Synapse — Your Personal AI Tutor</title>
<meta name="description" content="A personal AI tutor that teaches from first principles, quizzes you, and uses spaced repetition so you never forget what matters.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧠</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<div id="app">
  <header id="hdr" style="display:none">
    <div class="logo" onclick="go('home')"><span class="dot">🧠</span> Synapse</div>
    <div class="hdr-right">
      <span class="pill" id="pill-streak" title="Daily streak">🔥 <b>0</b></span>
      <span class="pill" id="pill-xp" title="Experience points">⚡ <b>0</b> XP</span>
      <button class="iconbtn" onclick="go('settings')" title="Settings">⚙️</button>
    </div>
  </header>

  <section class="view" id="view-onboarding"></section>
  <section class="view" id="view-home"></section>
  <section class="view" id="view-tutor"></section>
  <section class="view" id="view-quiz"></section>
  <section class="view" id="view-review"></section>
  <section class="view" id="view-paths"></section>
  <section class="view" id="view-settings"></section>

  <nav class="tabs" id="mainnav" style="display:none">
    <button data-v="home"><span class="ico">🏠</span>Home</button>
    <button data-v="tutor"><span class="ico">💬</span>Tutor</button>
    <button data-v="quiz"><span class="ico">🎯</span>Quiz</button>
    <button data-v="review" id="navreview"><span class="ico">🃏</span>Review</button>
    <button data-v="paths"><span class="ico">🗺️</span>Paths</button>
  </nav>
</div>

<div id="toasts"></div>
<dialog id="modal"></dialog>

<script type="module" src="js/app.js"></script>
</body>
</html>
