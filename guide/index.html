<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Claude Architect Certification — Interactive Study Guide</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
  <!-- Markdown + syntax highlighting -->
  <script src="https://cdn.jsdelivr.net/npm/marked@9/marked.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <style>
    :root {
      --bg: #050810;
      --card-bg: #0d1117;
      --card-hover: #161b22;
      --border: rgba(255,255,255,0.08);
      --red: #EE352E;
      --orange: #FF6319;
      --green: #6CBE45;
      --yellow: #FCCC0A;
      --blue: #0039A6;
      --text: #e6edf3;
      --muted: #8b949e;
      --sidebar-w: 268px;
      --topbar-h: 52px;
      --radius: 10px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ── Sidebar ─────────────────────────────────────── */
    #sidebar {
      position: fixed;
      top: 0; left: 0;
      width: var(--sidebar-w);
      height: 100vh;
      background: var(--card-bg);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      z-index: 200;
      transition: transform 0.28s ease;
    }

    .sidebar-logo {
      padding: 18px 20px 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }
    .sidebar-logo .logo-badge {
      width: 34px; height: 34px;
      background: var(--red);
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-size: 16px; font-weight: 800; color: #fff;
      flex-shrink: 0;
    }
    .sidebar-logo .logo-text { line-height: 1.2; }
    .sidebar-logo .logo-title { font-size: 13px; font-weight: 700; color: var(--text); }
    .sidebar-logo .logo-sub { font-size: 11px; color: var(--muted); }

    #chapter-nav {
      flex: 1;
      overflow-y: auto;
      padding: 10px 0;
      scrollbar-width: thin;
      scrollbar-color: var(--border) transparent;
    }
    #chapter-nav::-webkit-scrollbar { width: 4px; }
    #chapter-nav::-webkit-scrollbar-track { background: transparent; }
    #chapter-nav::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 20px;
      cursor: pointer;
      border-left: 3px solid transparent;
      transition: background 0.15s, border-color 0.15s;
      text-decoration: none;
      color: var(--muted);
      font-size: 13px;
      font-weight: 500;
      line-height: 1.35;
    }
    .nav-item:hover { background: var(--card-hover); color: var(--text); }
    .nav-item.active {
      border-left-color: var(--red);
      background: rgba(238,53,46,0.08);
      color: var(--text);
    }
    .nav-item.visited .nav-num { background: var(--green); color: #000; }
    .nav-num {
      width: 22px; height: 22px;
      border-radius: 50%;
      background: rgba(255,255,255,0.06);
      color: var(--muted);
      font-size: 10px; font-weight: 700;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      transition: background 0.2s, color 0.2s;
    }
    .nav-item.active .nav-num { background: var(--red); color: #fff; }

    .sidebar-footer {
      padding: 16px 20px;
      border-top: 1px solid var(--border);
      flex-shrink: 0;
    }
    .progress-label {
      display: flex; justify-content: space-between; align-items: center;
      font-size: 11px; font-weight: 600; color: var(--muted);
      margin-bottom: 8px;
    }
    .progress-track {
      height: 5px; border-radius: 3px;
      background: rgba(255,255,255,0.08);
      overflow: hidden;
    }
    .progress-fill {
      height: 100%; border-radius: 3px;
      background: linear-gradient(90deg, var(--red), var(--orange));
      transition: width 0.4s ease;
      width: 0%;
    }

    /* ── Topbar ──────────────────────────────────────── */
    #topbar {
      position: fixed;
      top: 0;
      left: var(--sidebar-w);
      right: 0;
      height: var(--topbar-h);
      background: rgba(5,8,16,0.92);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 0 28px;
      z-index: 100;
      transition: left 0.28s ease;
    }

    #hamburger {
      display: none;
      background: none; border: none;
      color: var(--text); cursor: pointer;
      padding: 6px; border-radius: 6px;
      flex-shrink: 0;
    }
    #hamburger:hover { background: var(--card-hover); }

    #breadcrumb {
      font-size: 14px; font-weight: 600; color: var(--text);
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }

    /* ── Main ────────────────────────────────────────── */
    #main {
      margin-left: var(--sidebar-w);
      padding-top: var(--topbar-h);
      min-height: 100vh;
      transition: margin-left 0.28s ease;
    }

    #content-wrap {
      max-width: 820px;
      margin: 0 auto;
      padding: 40px 36px 80px;
    }

    /* ── Welcome screen ─────────────────────────────── */
    #welcome {
      text-align: center;
      padding: 60px 0;
    }
    #welcome .w-badge {
      display: inline-flex; align-items: center; justify-content: center;
      width: 64px; height: 64px;
      background: linear-gradient(135deg, var(--red), var(--orange));
      border-radius: 16px;
      font-size: 28px;
      margin-bottom: 24px;
    }
    #welcome h1 {
      font-size: 28px; font-weight: 800;
      background: linear-gradient(135deg, #fff 0%, var(--muted) 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      margin-bottom: 12px;
    }
    #welcome p {
      font-size: 16px; color: var(--muted); max-width: 500px; margin: 0 auto 32px;
      line-height: 1.6;
    }
    .chapter-grid {
      display: grid; grid-template-columns: 1fr 1fr;
      gap: 10px; text-align: left; max-width: 560px; margin: 0 auto;
    }
    .chapter-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 12px 16px;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
    }
    .chapter-card:hover { border-color: var(--red); background: var(--card-hover); }
    .chapter-card .cc-num { font-size: 11px; font-weight: 700; color: var(--red); margin-bottom: 3px; }
    .chapter-card .cc-title { font-size: 13px; font-weight: 600; color: var(--text); }

    /* ── Loading ─────────────────────────────────────── */
    #loading {
      display: none;
      text-align: center;
      padding: 80px 0;
    }
    .spinner {
      width: 36px; height: 36px;
      border: 3px solid var(--border);
      border-top-color: var(--red);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      margin: 0 auto 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #loading p { color: var(--muted); font-size: 14px; }

    /* ── Chapter nav buttons ─────────────────────────── */
    .ch-nav-btns {
      display: flex; justify-content: space-between; gap: 12px;
      margin-top: 52px;
      padding-top: 24px;
      border-top: 1px solid var(--border);
    }
    .ch-nav-btn {
      display: flex; align-items: center; gap: 8px;
      padding: 10px 20px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text); font-size: 14px; font-weight: 600;
      cursor: pointer; transition: border-color 0.15s, background 0.15s;
    }
    .ch-nav-btn:hover { border-color: var(--red); background: var(--card-hover); }
    .ch-nav-btn:disabled { opacity: 0.3; cursor: not-allowed; }

    /* ── Mobile overlay ──────────────────────────────── */
    #overlay {
      display: none;
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.6);
      z-index: 150;
    }

    /* ── Responsive ──────────────────────────────────── */
    @media (max-width: 768px) {
      #sidebar { transform: translateX(-100%); }
      #sidebar.open { transform: translateX(0); }
      #topbar { left: 0; }
      #main { margin-left: 0; }
      #hamburger { display: flex; }
      #overlay.show { display: block; }
      #content-wrap { padding: 28px 20px 60px; }
      .chapter-grid { grid-template-columns: 1fr; }
    }

    /* ── Shared widget styles ────────────────────────── */
    .widget {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 22px 24px;
      margin: 28px 0;
    }
    .widget-hdr { display: flex; align-items: flex-start; gap: 14px; margin-bottom: 18px; }
    .widget-icon {
      width: 40px; height: 40px; border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: 18px; flex-shrink: 0;
    }
    .widget-title { font-size: 15px; font-weight: 700; color: #fff; }
    .widget-sub { font-size: 12px; color: var(--muted); margin-top: 2px; }
    .widget-note { font-size: 12px; color: var(--muted); margin-top: 10px; }

    /* Token calculator */
    .calc-textarea {
      width: 100%; min-height: 90px;
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--border); border-radius: 8px;
      color: var(--text); font-family: monospace; font-size: 13px;
      padding: 10px 14px; resize: vertical;
      outline: none;
    }
    .calc-textarea:focus { border-color: var(--orange); }
    .calc-stats { display: flex; gap: 16px; margin: 14px 0; }
    .calc-stat { text-align: center; flex: 1;
      background: rgba(255,255,255,0.04); border-radius: 8px; padding: 10px; }
    .cs-val { font-size: 22px; font-weight: 800; color: var(--orange); }
    .cs-lbl { font-size: 11px; color: var(--muted); margin-top: 2px; }
    .cost-table { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 8px; }
    .cost-table th { background: rgba(255,255,255,0.06); padding: 8px 12px; text-align: left;
      border: 1px solid var(--border); font-size: 12px; font-weight: 700; color: var(--muted); }
    .cost-table td { padding: 8px 12px; border: 1px solid var(--border); color: var(--text); }
    .cost-table tr:nth-child(even) td { background: rgba(255,255,255,0.02); }

    /* Model cards */
    .model-cards-grid { display: flex; flex-direction: column; gap: 10px; }
    .model-card {
      border: 1px solid var(--border); border-radius: 10px;
      overflow: hidden; cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
      padding: 14px 18px;
    }
    .model-card:hover { border-color: rgba(255,255,255,0.2); background: var(--card-hover); }
    .model-card.mc-open { border-color: rgba(255,255,255,0.25); }
    .mc-header { display: flex; align-items: center; gap: 12px; }
    .mc-emoji { width: 36px; height: 36px; border-radius: 8px;
      display: flex; align-items: center; justify-content: center; font-size: 17px; flex-shrink: 0; }
    .mc-name-wrap { flex: 1; }
    .mc-name { font-size: 16px; font-weight: 800; }
    .mc-tag { font-size: 12px; color: var(--muted); margin-top: 1px; }
    .mc-chevron { color: var(--muted); font-size: 11px; transition: transform 0.2s; }
    .mc-open .mc-chevron { transform: rotate(180deg); }
    .mc-bars { margin-top: 12px; display: flex; flex-direction: column; gap: 7px; }
    .mc-bar-row { display: flex; align-items: center; gap: 10px; font-size: 12px; color: var(--muted); }
    .mc-bar-row span:first-child { width: 68px; text-align: right; flex-shrink: 0; }
    .mc-bar-row span:last-child { width: 32px; text-align: right; flex-shrink: 0; }
    .mc-track { flex: 1; height: 6px; background: rgba(255,255,255,0.08); border-radius: 3px; overflow: hidden; }
    .mc-fill { height: 100%; border-radius: 3px; transition: width 0.4s ease; }
    .mc-detail { margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--border); }
    .mc-section { margin-bottom: 10px; font-size: 13px; }
    .mc-section ul { margin: 4px 0 0 18px; }
    .mc-section li { margin: 2px 0; color: var(--text); }
    .mc-price { font-size: 12px; color: var(--yellow);
      background: rgba(252,204,10,0.08); padding: 7px 12px; border-radius: 6px; margin-top: 8px; }

    /* ── Markdown typography ─────────────────────────── */
    #md-output { line-height: 1.75; font-size: 15px; }
    #md-output h1 { font-size: 26px; font-weight: 800; margin: 0 0 8px; color: #fff; }
    #md-output h2 { font-size: 20px; font-weight: 700; margin: 40px 0 12px;
      padding-bottom: 8px; border-bottom: 1px solid var(--border); color: #fff; }
    #md-output h3 { font-size: 16px; font-weight: 700; margin: 28px 0 10px; color: var(--text); }
    #md-output h4 { font-size: 14px; font-weight: 700; margin: 20px 0 8px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
    #md-output p  { margin: 0 0 16px; color: var(--text); }
    #md-output ul, #md-output ol { margin: 0 0 16px 24px; }
    #md-output li { margin: 4px 0; color: var(--text); }
    #md-output li::marker { color: var(--red); }
    #md-output strong { font-weight: 700; color: #fff; }
    #md-output em { font-style: italic; color: var(--muted); }
    #md-output a { color: var(--orange); text-decoration: none; }
    #md-output a:hover { text-decoration: underline; }
    #md-output blockquote {
      border-left: 3px solid var(--orange);
      margin: 16px 0; padding: 12px 16px;
      background: rgba(255,99,25,0.06);
      border-radius: 0 var(--radius) var(--radius) 0;
      color: var(--muted); font-style: italic;
    }
    #md-output hr { border: none; border-top: 1px solid var(--border); margin: 32px 0; }
    #md-output table { width: 100%; border-collapse: collapse; margin: 16px 0 24px; font-size: 14px; }
    #md-output th { background: rgba(255,255,255,0.06); color: var(--text); font-weight: 700;
      padding: 10px 14px; text-align: left; border: 1px solid var(--border); }
    #md-output td { padding: 9px 14px; border: 1px solid var(--border); color: var(--text); vertical-align: top; }
    #md-output tr:nth-child(even) td { background: rgba(255,255,255,0.02); }
    #md-output code:not(pre code) {
      background: rgba(255,255,255,0.08); color: var(--green);
      padding: 2px 6px; border-radius: 4px; font-size: 13px; font-family: monospace;
    }

    /* ── Code blocks ─────────────────────────────────── */
    #md-output pre {
      position: relative;
      background: #0d1117 !important;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      margin: 16px 0 24px;
      overflow: auto;
      padding: 16px !important;
    }
    #md-output pre code { background: none !important; padding: 0 !important; font-size: 13px !important; }
    .code-lang {
      position: absolute; top: 10px; right: 48px;
      font-size: 10px; font-weight: 700; text-transform: uppercase;
      color: var(--muted); letter-spacing: .05em;
      pointer-events: none;
    }
    .copy-btn {
      position: absolute; top: 8px; right: 10px;
      background: rgba(255,255,255,0.06);
      border: 1px solid var(--border);
      color: var(--muted); font-size: 11px; font-weight: 600;
      padding: 3px 9px; border-radius: 5px;
      cursor: pointer; transition: background 0.15s, color 0.15s;
    }
    .copy-btn:hover { background: rgba(255,255,255,0.12); color: var(--text); }
    .copy-btn.copied { color: var(--green); border-color: var(--green); }
  </style>
</head>
<body>

<!-- Mobile overlay -->
<div id="overlay" onclick="closeSidebar()"></div>

<!-- Sidebar -->
<aside id="sidebar">
  <div class="sidebar-logo">
    <div class="logo-badge">CA</div>
    <div class="logo-text">
      <div class="logo-title">Claude Architect</div>
      <div class="logo-sub">Certification Guide</div>
    </div>
  </div>
  <nav id="chapter-nav"></nav>
  <div class="sidebar-footer">
    <div class="progress-label">
      <span>Progress</span>
      <span id="progress-text">0 / 10</span>
    </div>
    <div class="progress-track">
      <div class="progress-fill" id="progress-fill"></div>
    </div>
  </div>
</aside>

<!-- Topbar -->
<header id="topbar">
  <button id="hamburger" onclick="toggleSidebar()" aria-label="Toggle menu">
    <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
      <rect y="2" width="18" height="2" rx="1" fill="currentColor"/>
      <rect y="8" width="18" height="2" rx="1" fill="currentColor"/>
      <rect y="14" width="18" height="2" rx="1" fill="currentColor"/>
    </svg>
  </button>
  <div id="breadcrumb">Select a chapter to begin</div>
</header>

<!-- Main content -->
<main id="main">
  <div id="content-wrap">

    <!-- Welcome screen -->
    <div id="welcome">
      <div class="w-badge">⚡</div>
      <h1>Claude Architect Certification</h1>
      <p>An interactive study guide covering the Anthropic API, prompt engineering, tool use, multi-agent systems, safety, and cost optimization.</p>
      <div class="chapter-grid" id="welcome-grid"></div>
    </div>

    <!-- Loading spinner -->
    <div id="loading">
      <div class="spinner"></div>
      <p>Loading chapter…</p>
    </div>

    <!-- Chapter content (populated by JS) -->
    <div id="chapter-content" style="display:none">
      <div id="md-output"></div>
      <div class="ch-nav-btns">
        <button class="ch-nav-btn" id="btn-prev" onclick="navigateChapter(-1)">← Previous</button>
        <button class="ch-nav-btn" id="btn-next" onclick="navigateChapter(1)">Next →</button>
      </div>
    </div>

  </div>
</main>

<script>
// ── Chapter list ──────────────────────────────────────────────────────────────
const CHAPTERS = [
  { id: 'ch01', file: 'chapters/ch01-api-foundations.md',         title: 'API Foundations' },
  { id: 'ch02', file: 'chapters/ch02-prompt-engineering.md',      title: 'Prompt Engineering' },
  { id: 'ch03', file: 'chapters/ch03-tool-use.md',                title: 'Tool Use' },
  { id: 'ch04', file: 'chapters/ch04-multi-agent.md',             title: 'Multi-Agent Systems' },
  { id: 'ch05', file: 'chapters/ch05-safety.md',                  title: 'Safety & Responsible AI' },
  { id: 'ch06', file: 'chapters/ch06-context-system-prompts.md',  title: 'Context & System Prompts' },
  { id: 'ch07', file: 'chapters/ch07-model-selection.md',         title: 'Model Selection' },
  { id: 'ch08', file: 'chapters/ch08-cost-optimization.md',       title: 'Cost Optimization' },
  { id: 'ch09', file: 'chapters/ch09-practice-questions.md',      title: 'Practice Questions' },
  { id: 'ch10', file: 'chapters/ch10-quick-reference.md',         title: 'Quick Reference' },
];

// ── State ─────────────────────────────────────────────────────────────────────
let currentIdx = -1;
const visited  = new Set();

// ── Build sidebar nav ─────────────────────────────────────────────────────────
function buildNav() {
  const nav  = document.getElementById('chapter-nav');
  const grid = document.getElementById('welcome-grid');
  CHAPTERS.forEach((ch, i) => {
    // Sidebar link
    const a = document.createElement('div');
    a.className = 'nav-item';
    a.dataset.idx = i;
    a.innerHTML = `<span class="nav-num">${i + 1}</span><span>${ch.title}</span>`;
    a.onclick = () => loadChapter(i);
    nav.appendChild(a);

    // Welcome grid card
    const card = document.createElement('div');
    card.className = 'chapter-card';
    card.innerHTML = `<div class="cc-num">Chapter ${i + 1}</div><div class="cc-title">${ch.title}</div>`;
    card.onclick = () => loadChapter(i);
    grid.appendChild(card);
  });
}

// ── Sidebar toggle (mobile) ───────────────────────────────────────────────────
function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('open');
  document.getElementById('overlay').classList.toggle('show');
}
function closeSidebar() {
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('overlay').classList.remove('show');
}

// ── Progress ──────────────────────────────────────────────────────────────────
function updateProgress() {
  const pct = (visited.size / CHAPTERS.length) * 100;
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('progress-text').textContent = `${visited.size} / ${CHAPTERS.length}`;
}

// ── Navigation ────────────────────────────────────────────────────────────────
function navigateChapter(dir) {
  const next = currentIdx + dir;
  if (next >= 0 && next < CHAPTERS.length) loadChapter(next);
}

// ── Load chapter placeholder (rendering added in Commit 2) ───────────────────
async function loadChapter(idx) {
  closeSidebar();
  currentIdx = idx;

  // Update sidebar active state
  document.querySelectorAll('.nav-item').forEach((el, i) => {
    el.classList.toggle('active', i === idx);
    if (visited.has(i)) el.classList.add('visited');
  });

  // Show loading
  document.getElementById('welcome').style.display = 'none';
  document.getElementById('chapter-content').style.display = 'none';
  document.getElementById('loading').style.display = 'block';

  // Update breadcrumb
  document.getElementById('breadcrumb').textContent =
    `Chapter ${idx + 1}: ${CHAPTERS[idx].title}`;

  // Update prev/next buttons
  document.getElementById('btn-prev').disabled = idx === 0;
  document.getElementById('btn-next').disabled = idx === CHAPTERS.length - 1;

  // Mark visited
  visited.add(idx);
  updateProgress();
  document.querySelector(`.nav-item[data-idx="${idx}"]`).classList.add('visited');

  // Fetch & render (filled in Commit 2)
  try {
    const res = await fetch(CHAPTERS[idx].file);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const md = await res.text();
    renderChapter(md, idx);
  } catch (err) {
    document.getElementById('loading').style.display = 'none';
    document.getElementById('md-output').innerHTML =
      `<div style="color:var(--red);padding:40px 0">
        <strong>Failed to load chapter.</strong><br>
        <small style="color:var(--muted)">${err.message}</small><br>
        <small style="color:var(--muted);margin-top:8px;display:block">
          If opening via file://, run a local server:<br>
          <code style="color:var(--green)">python -m http.server 8080</code>
          then open <code style="color:var(--green)">http://localhost:8080/guide/</code>
        </small>
      </div>`;
    document.getElementById('chapter-content').style.display = 'block';
  }
}

// ── Configure marked ─────────────────────────────────────────────────────────
marked.setOptions({ gfm: true, breaks: false });

// ── Render chapter ────────────────────────────────────────────────────────────
function renderChapter(md, idx) {
  const output = document.getElementById('md-output');
  output.innerHTML = marked.parse(md);

  enhanceCodeBlocks(output);
  injectWidgets(output, idx);

  document.getElementById('loading').style.display = 'none';
  document.getElementById('chapter-content').style.display = 'block';

  // Scroll to top of content
  document.getElementById('content-wrap').scrollIntoView({ behavior: 'smooth', block: 'start' });
  window.scrollTo(0, 0);
}

// ── Code block enhancements ───────────────────────────────────────────────────
function enhanceCodeBlocks(container) {
  container.querySelectorAll('pre code').forEach(block => {
    // Detect language from class (highlight.js class like "language-python")
    const cls = block.className || '';
    const langMatch = cls.match(/language-(\w+)/);
    const lang = langMatch ? langMatch[1] : '';

    // Apply highlight.js
    if (lang && hljs.getLanguage(lang)) {
      block.innerHTML = hljs.highlight(block.textContent, { language: lang }).value;
    } else {
      hljs.highlightElement(block);
    }

    const pre = block.parentElement;
    pre.style.position = 'relative';

    // Language badge
    if (lang && lang !== 'plaintext') {
      const badge = document.createElement('span');
      badge.className = 'code-lang';
      badge.textContent = lang;
      pre.appendChild(badge);
    }

    // Copy button
    const btn = document.createElement('button');
    btn.className = 'copy-btn';
    btn.textContent = 'Copy';
    btn.onclick = () => {
      navigator.clipboard.writeText(block.textContent).then(() => {
        btn.textContent = '✓ Copied';
        btn.classList.add('copied');
        setTimeout(() => { btn.textContent = 'Copy'; btn.classList.remove('copied'); }, 2000);
      });
    };
    pre.appendChild(btn);
  });
}

// ── Widget injection dispatcher ───────────────────────────────────────────────
function injectWidgets(container, idx) {
  const ch = CHAPTERS[idx].id;
  if (ch === 'ch08') injectAfterHeading(container, 'Approximate Pricing Reference', buildTokenCalculator());
  if (ch === 'ch07') injectAfterHeading(container, 'Model Comparison Table', buildModelCards());
}

function injectAfterHeading(container, text, html) {
  const headings = container.querySelectorAll('h1,h2,h3,h4');
  for (const h of headings) {
    if (h.textContent.includes(text)) {
      h.insertAdjacentHTML('afterend', html);
      return true;
    }
  }
  // Fallback: inject at top
  container.insertAdjacentHTML('afterbegin', html);
  return false;
}

// ── Token Calculator (ch08) ───────────────────────────────────────────────────
function buildTokenCalculator() {
  return `
<div class="widget" id="w-token-calc">
  <div class="widget-hdr">
    <span class="widget-icon" style="background:linear-gradient(135deg,var(--orange),var(--yellow))">🧮</span>
    <div>
      <div class="widget-title">Live Token &amp; Cost Calculator</div>
      <div class="widget-sub">Type any text to estimate tokens and API cost</div>
    </div>
  </div>
  <textarea id="calc-input" class="calc-textarea" placeholder="Paste or type any text here…" oninput="calcTokens()"></textarea>
  <div class="calc-stats">
    <div class="calc-stat">
      <div class="cs-val" id="calc-chars">0</div>
      <div class="cs-lbl">Characters</div>
    </div>
    <div class="calc-stat">
      <div class="cs-val" id="calc-toks">0</div>
      <div class="cs-lbl">Est. Tokens</div>
    </div>
    <div class="calc-stat">
      <div class="cs-val" id="calc-words">0</div>
      <div class="cs-lbl">Words</div>
    </div>
  </div>
  <table class="cost-table">
    <thead><tr><th>Model</th><th>Input cost</th><th>Output cost*</th><th>Total*</th></tr></thead>
    <tbody>
      <tr>
        <td><strong>Haiku</strong></td>
        <td id="cost-h-in">—</td><td id="cost-h-out">—</td><td id="cost-h-tot">—</td>
      </tr>
      <tr>
        <td><strong>Sonnet</strong></td>
        <td id="cost-s-in">—</td><td id="cost-s-out">—</td><td id="cost-s-tot">—</td>
      </tr>
      <tr>
        <td><strong>Opus</strong></td>
        <td id="cost-o-in">—</td><td id="cost-o-out">—</td><td id="cost-o-tot">—</td>
      </tr>
    </tbody>
  </table>
  <p class="widget-note">* Output cost assumes Claude generates the same number of tokens as input. Adjust for your actual use case.</p>
</div>`;
}

function calcTokens() {
  const txt   = document.getElementById('calc-input').value;
  const chars = txt.length;
  const words = txt.trim() ? txt.trim().split(/\s+/).length : 0;
  const toks  = Math.round(chars / 4);

  document.getElementById('calc-chars').textContent = chars.toLocaleString();
  document.getElementById('calc-words').textContent = words.toLocaleString();
  document.getElementById('calc-toks').textContent  = toks.toLocaleString();

  // Pricing per million tokens
  const P = {
    h: { in: 0.25,  out: 1.25  },
    s: { in: 3.00,  out: 15.00 },
    o: { in: 15.00, out: 75.00 },
  };
  const fmt = v => v < 0.000001 ? '$0.00' : v < 0.01 ? `$${v.toFixed(6)}` : `$${v.toFixed(4)}`;
  for (const [k, r] of Object.entries(P)) {
    const inCost  = (toks / 1e6) * r.in;
    const outCost = (toks / 1e6) * r.out;
    document.getElementById(`cost-${k}-in`).textContent  = fmt(inCost);
    document.getElementById(`cost-${k}-out`).textContent = fmt(outCost);
    document.getElementById(`cost-${k}-tot`).textContent = fmt(inCost + outCost);
  }
}
